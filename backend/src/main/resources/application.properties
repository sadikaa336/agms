# Spring Boot Application Settings
spring.application.name=gas-meter-api

# Server Configuration
server.port=8080

# Database Configuration (MySQL)
# Defaulted to localhost connection suitable for local XAMPP / WAMP installations
spring.datasource.url=jdbc:mysql://localhost:3306/gas_meter_management?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Key Settings (default secret key for development HS256)
jwt.secret=9a4f2c8d3b7a1e5f8g0h2i4j6k8l0m2n4o6p8q0r2s4t6u8v0w2x4y6z8a0b2c4d
jwt.expiration=86400000

# DLMS/COSEM Communication Settings (Disabled by default: system uses software simulated meter via REST API)
meter.communication.enabled=false
meter.communication.port=5000
